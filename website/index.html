<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Join the Server</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0a0c14;
  --ink2:#12151f;
  --ink3:#1a1e2e;
  --surface:rgba(255,255,255,0.035);
  --surface2:rgba(255,255,255,0.06);
  --border:rgba(255,255,255,0.07);
  --border2:rgba(255,255,255,0.12);
  --text:#edf0ff;
  --muted:#8892a4;
  --muted2:#556070;
  --brand:#5865f2;
  --brand2:#7289da;
  --cyan:#00d4ff;
  --violet:#9333ea;
  --green:#22c55e;
}
html{scroll-behavior:smooth}
body{
  background:var(--ink);
  color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  overflow-x:hidden;
  min-height:100vh;
}

#bgCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.6}

.noise{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:128px 128px;
}

nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:20px 48px;
  display:flex;align-items:center;justify-content:space-between;
  backdrop-filter:blur(20px);
  border-bottom:1px solid transparent;
  transition:border-color .3s,background .3s;
}
nav.scrolled{background:rgba(10,12,20,.85);border-color:var(--border)}
.nav-logo{
  display:flex;align-items:center;gap:10px;
  font-family:'Syne',sans-serif;font-size:1.1rem;font-weight:800;letter-spacing:-0.5px;
}
.nav-logo-dot{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,var(--brand),var(--violet));
  display:flex;align-items:center;justify-content:center;
}
.nav-logo-dot svg{width:18px;height:18px;fill:#fff}
.nav-btn{
  display:flex;align-items:center;gap:8px;
  padding:10px 22px;border-radius:10px;border:1px solid var(--border2);
  background:var(--surface2);color:var(--text);
  font-family:inherit;font-size:.85rem;font-weight:600;letter-spacing:.5px;
  text-decoration:none;cursor:pointer;
  transition:background .2s,border-color .2s,transform .15s;
}
.nav-btn:hover{background:rgba(88,101,242,.15);border-color:rgba(88,101,242,.4);transform:translateY(-1px)}
.nav-btn svg{width:16px;height:16px;fill:currentColor}

.hero{
  position:relative;z-index:10;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;
  padding:120px 24px 80px;
  gap:0;
}

.live-badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:6px 16px 6px 10px;
  border-radius:100px;
  border:1px solid rgba(34,197,94,.25);
  background:rgba(34,197,94,.08);
  font-size:.75rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#4ade80;
  margin-bottom:32px;
  animation:fade-up .7s cubic-bezier(.16,1,.3,1) .1s both;
}
.live-pulse{
  width:8px;height:8px;border-radius:50%;background:#22c55e;
  animation:pulse-green 1.8s ease-in-out infinite;
}
@keyframes pulse-green{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}

.hero-headline{
  font-family:'Syne',sans-serif;
  font-size:clamp(3rem,8vw,6.5rem);
  font-weight:800;
  line-height:.95;
  letter-spacing:-3px;
  margin-bottom:28px;
  animation:fade-up .8s cubic-bezier(.16,1,.3,1) .2s both;
}
.hero-headline .line1{display:block;color:var(--text)}
.hero-headline .line2{
  display:block;
  background:linear-gradient(135deg,var(--cyan) 0%,var(--brand) 40%,var(--violet) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

.hero-sub{
  max-width:520px;font-size:1.1rem;line-height:1.65;color:var(--muted);
  margin-bottom:48px;font-weight:400;
  animation:fade-up .8s cubic-bezier(.16,1,.3,1) .3s both;
}

.cta-group{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
  animation:fade-up .8s cubic-bezier(.16,1,.3,1) .4s both;
  margin-bottom:72px;
}
.btn-primary{
  position:relative;overflow:hidden;
  display:inline-flex;align-items:center;gap:10px;
  padding:16px 32px;border-radius:14px;border:none;
  background:linear-gradient(135deg,var(--brand),var(--violet));
  color:#fff;font-family:inherit;font-size:.95rem;font-weight:700;letter-spacing:.3px;
  text-decoration:none;cursor:pointer;
  box-shadow:0 0 40px rgba(88,101,242,.35),0 8px 32px rgba(0,0,0,.4);
  transition:transform .2s,box-shadow .2s;
}
.btn-primary::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);
  opacity:0;transition:opacity .2s;
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 0 60px rgba(88,101,242,.5),0 16px 48px rgba(0,0,0,.4)}
.btn-primary:hover::before{opacity:1}
.btn-primary svg{width:20px;height:20px;fill:currentColor}
.btn-secondary{
  display:inline-flex;align-items:center;gap:8px;
  padding:16px 28px;border-radius:14px;
  border:1px solid var(--border2);background:var(--surface);
  color:var(--text);font-family:inherit;font-size:.95rem;font-weight:600;
  text-decoration:none;cursor:pointer;
  transition:background .2s,border-color .2s,transform .2s;
}
.btn-secondary:hover{background:var(--surface2);border-color:var(--border2);transform:translateY(-3px)}

.scroll-hint{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  color:var(--muted2);font-size:.75rem;letter-spacing:2px;text-transform:uppercase;
  animation:fade-up .8s cubic-bezier(.16,1,.3,1) .6s both;
}
.scroll-line{
  width:1px;height:40px;
  background:linear-gradient(to bottom,var(--border2),transparent);
  animation:scroll-pulse 2s ease-in-out infinite;
}
@keyframes scroll-pulse{0%,100%{opacity:.4;transform:scaleY(1)}50%{opacity:1;transform:scaleY(1.2)}}

.stats-band{
  position:relative;z-index:10;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  background:var(--surface);
  backdrop-filter:blur(12px);
  padding:28px 48px;
  display:flex;align-items:center;justify-content:center;gap:0;
  flex-wrap:wrap;
}
.stat-item{
  flex:1;min-width:140px;max-width:220px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:12px 24px;
  border-right:1px solid var(--border);
}
.stat-item:last-child{border-right:none}
.stat-val{
  font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;
  background:linear-gradient(135deg,#fff,var(--muted));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.stat-lbl{font-size:.72rem;color:var(--muted2);letter-spacing:2px;text-transform:uppercase}

.section{
  position:relative;z-index:10;
  padding:100px 48px;
  max-width:1100px;margin:0 auto;
}
.section-eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.72rem;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:var(--brand2);margin-bottom:16px;
}
.section-eyebrow::before{content:'';width:20px;height:1px;background:var(--brand2)}
.section-title{
  font-family:'Syne',sans-serif;font-size:clamp(2rem,4vw,3.2rem);font-weight:800;
  letter-spacing:-1.5px;line-height:1.05;margin-bottom:60px;
}
.section-title span{
  background:linear-gradient(135deg,var(--cyan),var(--brand));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

.feat-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;
}
.feat-card{
  padding:32px 28px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--surface);
  backdrop-filter:blur(12px);
  position:relative;overflow:hidden;
  transition:transform .3s,border-color .3s,box-shadow .3s;
}
.feat-card::after{
  content:'';position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle at 50% 0%,rgba(88,101,242,.08),transparent 60%);
  opacity:0;transition:opacity .3s;
}
.feat-card:hover{
  transform:translateY(-6px);
  border-color:rgba(88,101,242,.3);
  box-shadow:0 24px 60px rgba(0,0,0,.4);
}
.feat-card:hover::after{opacity:1}
.feat-icon{
  width:48px;height:48px;border-radius:18px;
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:18px;
}
